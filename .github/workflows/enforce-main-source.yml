name: enforce-main-source

on:
  pull_request:
    branches: [main]

jobs:
  require-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch for PRs into main
        if: github.event.pull_request.head.ref != 'dev'
        run: |
          echo "PRs into main must come from dev (got '${{ github.event.pull_request.head.ref }}')."
          exit 1
